    <!-- Theme + language before React (reduces wrong-language flash with i18n) -->
    <script>
      (function() {
        var theme = localStorage.getItem('innerbloom-theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var LANGS = ['it','en','de','fr','es','ru','ro','pt','zh'];
        try {
          var saved = localStorage.getItem('innerbloom-language');
          var lng = 'it';
          if (saved && LANGS.indexOf(saved) !== -1) {
            lng = saved;
          } else {
            var nav = (navigator.language || 'it').toLowerCase();
            if (nav.indexOf('zh') === 0) lng = 'zh';
            else {
              for (var i = 0; i < LANGS.length; i++) {
                if (nav.indexOf(LANGS[i]) === 0) { lng = LANGS[i]; break; }
              }
            }
          }
          document.documentElement.lang = lng === 'zh' ? 'zh-CN' : lng;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
